plugins {
    id 'fabric-loom' version '1.9.2'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand('version': project.version) }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}


base { archivesName = 'SpidiBan-1.21.4' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.register('protocolTest', JavaExec) {
 dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'net.spidiboost.shist.ShistProtocolTest'; jvmArgs '-ea'
}
check.dependsOn protocolTest

apply from: 'shared-updater.gradle'

dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
test { useJUnitPlatform() }

sourceSets { runtimeProbe {
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
} }
if(project.hasProperty('shistNative')) {
    loom.mods { spidiban { sourceSet sourceSets.main }; spidiban_probe { sourceSet sourceSets.runtimeProbe } }
    loom.runs { verification {
        client(); source sourceSets.runtimeProbe; runDir 'build/runtime-verification'
        programArgs '--username','SpidiBanQA'
        if(System.getProperty('os.name').startsWith('Mac'))vmArg '-XstartOnFirstThread'
    } }
    tasks.named('runVerification',JavaExec) {
        doFirst {
            def options=file('build/runtime-verification/options.txt');options.parentFile.mkdirs()
            options.text='onboardAccessibility:false\nlang:ru_ru\nmaxFps:60\npauseOnLostFocus:false\nsoundCategory_master:0.0\n'
            file('build/runtime-verification/native-shist-results.txt').delete()
        }
        doLast {
            def report=file('build/runtime-verification/native-shist-results.txt')
            if(!report.isFile()||!report.text.contains('PASS')||report.text.contains('FAIL'))throw new GradleException('Native shist verification failed: '+report)
        }
    }
}
